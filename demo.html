<!DOCTYPE html>
<html>
 <head>
    <title>My First Webpage</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background : linear-gradient(135deg, #6378d8, #764ba2);
            min-height: 100vh;
            margin : 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }
        h1{
            color: #5b45c5;
            margin-bottom: 20px;
        }
        p{
            color: #555555;
            font-size: 18px;
            margin-bottom: 20px;
        }
        button{
            background-color: #5b45c5;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover{
            background-color: #4ba251;
        }
    </style>

 </head>  
 <body>
    <h1>Welcome to my Cloud Class</h1>
    <p>I am learning Cloud Computing</p>
    <button>Start Learning</button>
 </body> 
</html>
